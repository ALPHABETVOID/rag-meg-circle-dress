<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4f0e7"><title>RAG MEG CIRCLE DRESS</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f0e7;color:#171717;font-family:"Courier New",monospace}canvas{width:100%;height:100%;display:block;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#title{position:absolute;top:12%;left:0;right:0;text-align:center;font-size:clamp(25px,7vw,54px);line-height:.92;letter-spacing:.05em}#title small{display:block;font-size:.48em;margin-top:9px;letter-spacing:.18em}#menu{position:absolute;top:40%;left:0;right:0;text-align:center;pointer-events:auto}.item{display:block;margin:19px auto;border:0;background:none;font:16px "Courier New";padding:8px 18px;cursor:pointer}.item:active{transform:translateY(1px)}#msg{position:absolute;top:13%;left:50%;transform:translateX(-50%);width:88%;text-align:center;font-size:13px;white-space:pre-line;opacity:0;transition:.25s}#note{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:10px;opacity:.58}.hidden{display:none!important}#settings{position:absolute;inset:25% 8% auto;text-align:center;background:#f4f0e7;padding:18px;border:1px solid #171717;pointer-events:auto;font-size:13px}#settings button{font:13px "Courier New";background:none;border:0;padding:8px}</style></head>
<body><canvas id="c"></canvas><div id="ui"><div id="title">RAG MEG<small>CIRCLE DRESS</small></div><div id="menu"><button class="item" data-a="begin">BEGIN</button><button class="item" data-a="settings">SETTINGS</button><button class="item" data-a="leave">LEAVE</button></div><div id="settings" class="hidden">SOUND — unfortunately<br><br>MUSIC — apparently<br><br>RAG QUALITY — <button id="ragq">rag</button><br><br>CIRCLE DRESS — yes<br><br><button id="back">back</button></div><div id="msg"></div><div id="note">poke the heap if you absolutely must</div></div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),msg=document.querySelector('#msg'),menu=document.querySelector('#menu'),title=document.querySelector('#title'),note=document.querySelector('#note'),settings=document.querySelector('#settings');
let W,H,dpr,t=0,state='menu',pokes=0,wind=0,meg={x:.5,v:0,step:0},gregged=false,homeFail=false;
const rnd=(a,b)=>a+Math.random()*(b-a), line=(a,b,c,d)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
function say(s,ms=1800){msg.textContent=s;msg.style.opacity=1;clearTimeout(say.q);say.q=setTimeout(()=>msg.style.opacity=0,ms)}
function base(){x.fillStyle='#f4f0e7';x.fillRect(0,0,W,H);x.strokeStyle='#171717';x.fillStyle='#171717';x.lineWidth=1.35;x.lineCap='round';x.lineJoin='round'}
function heap(){let cx=W*.5,cy=H*.78; x.beginPath();x.moveTo(cx-48,cy);x.bezierCurveTo(cx-43,cy-17,cx-20,cy-26,cx-5,cy-16);x.bezierCurveTo(cx+11,cy-31,cx+44,cy-15,cx+52,cy);x.closePath();x.stroke();for(let i=-32;i<35;i+=11){x.globalAlpha=.18;line(cx+i,cy-15,cx+i+10,cy-2);x.globalAlpha=1}x.beginPath();x.arc(cx+7,cy-12,1.4,0,7);if(pokes>3)x.fill();x.beginPath();x.moveTo(cx+45,cy-4);x.bezierCurveTo(cx+70+wind,cy-14,cx+58,cy-28,cx+76+wind*2,cy-26);x.stroke();wind*=.94}
function world(){let g=H*.78;line(0,g,W,g);let hx=W*.07,hw=Math.min(115,W*.27);x.beginPath();x.arc(hx+hw/2,g-62,hw/2,Math.PI,0);x.lineTo(hx+hw,g);x.lineTo(hx,g);x.closePath();x.stroke();x.strokeRect(hx+hw*.42,g-52,hw*.22,52);x.font='9px Courier New';x.fillText('HOME, APPARENTLY',hx,g+16);let gx=W*.84,gy=g-80;x.strokeRect(gx-9,gy-66,18,66);x.beginPath();x.arc(gx,gy-75,8,0,7);x.stroke();line(gx-6,gy-42,gx-23,gy-18);line(gx+6,gy-42,gx+23,gy-18);line(gx-4,gy,gx-7,g);line(gx+4,gy,gx+7,g);x.fillText('LONG GREG',gx-27,g+16);x.beginPath();x.arc(W*.75,H*.16,17,0,7);x.stroke();x.fillText('LOCAL ORB',W*.75-27,H*.16+33)}
function drawMeg(){let cx=meg.x*W,g=H*.78,cy=g-80,bob=Math.sin(t*.02+meg.step)*Math.min(3,Math.abs(meg.v)*700);cy+=bob;line(cx-11,cy+55,cx-15+Math.sin(t*.02)*2,g);line(cx+11,cy+55,cx+16+Math.sin(t*.018+2)*2,g);x.beginPath();for(let i=0;i<26;i++){let a=i/26*Math.PI*2,r=35+wind*Math.sin(a*3+t*.03)+meg.v*2200*Math.cos(a),px=cx+Math.cos(a)*r,py=cy+48+Math.sin(a)*r*.52;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.stroke();let p=[[-24,-50],[-9,-58],[8,-54],[24,-45],[21,-10],[28,16],[17,42],[-4,39],[-20,45],[-27,17],[-21,-9]];x.beginPath();p.forEach((q,i)=>{let sw=wind*.22*Math.sin(i*1.7+t*.025)+meg.v*900*(i<4?-1:1),px=cx+q[0]+sw,py=cy+q[1]+Math.sin(t*.02+i)*.7;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.stroke();x.globalAlpha=.2;for(let i=-16;i<=16;i+=8)line(cx+i,cy-43,cx+i+8,cy+25);x.globalAlpha=1;x.beginPath();x.arc(cx-8,cy-21,1.3,0,7);x.arc(cx+8,cy-21,1.3,0,7);x.fill();line(cx-6,cy-8,cx+6,cy-8);x.beginPath();x.moveTo(cx+22,cy-39);x.bezierCurveTo(cx+39+wind,cy-46,cx+31+wind*2,cy-57,cx+44+wind*3,cy-54);x.stroke();wind*=.96}
function tick(){t++;base();if(state==='menu'||state==='leaving')heap();else if(state==='game'){meg.x+=meg.v;meg.v*=.87;meg.x=Math.max(.05,Math.min(.95,meg.x));if(Math.abs(meg.v)>.001)meg.step+=Math.abs(meg.v)*12;world();drawMeg();if(meg.x>.72&&!gregged){gregged=true;say('LONG GREG: THE FESTIVAL NEEDS YOU.\nMEG: that seems administrative.',2800)}if(meg.x<.18&&gregged&&!homeFail){homeFail=true;say('QUEST COMPLETE: CRISIS AVOIDED.',2200)}}requestAnimationFrame(tick)}
function begin(){state='game';menu.classList.add('hidden');title.classList.add('hidden');note.textContent='tap left/right to move · tap meg to endure';say('OBJECTIVE COMPLETE: WAKE UP.');setTimeout(()=>say('OBJECTIVE FAILED: GET DRESSED.'),2100)}
function leave(){state='leaving';menu.classList.add('hidden');say('GOOD CHOICE.',1700);setTimeout(()=>{say('iOS has returned Meg to her obligations.',2200);menu.classList.remove('hidden')},2100)}
menu.onclick=e=>{let a=e.target.dataset.a;if(a==='begin')begin();if(a==='settings'){settings.classList.remove('hidden');menu.classList.add('hidden')}if(a==='leave')leave()};
document.querySelector('#back').onclick=()=>{settings.classList.add('hidden');menu.classList.remove('hidden')};let qs=['rag','better rag','irresponsible'];document.querySelector('#ragq').onclick=e=>e.target.textContent=qs[(qs.indexOf(e.target.textContent)+1)%3];
c.addEventListener('pointerdown',e=>{if(state==='menu'){pokes++;wind=rnd(-10,10);if(pokes===4)say('MEG: can I help you',1900);else if(pokes>5)say('MEG HAS RECEIVED YOUR FEEDBACK.',1400);return}if(state!=='game')return;let mx=meg.x*W,my=H*.69;if(Math.hypot(e.clientX-mx,e.clientY-my)<75){wind=rnd(8,16)*(Math.random()<.5?-1:1);say(['MEG ENDURES.','NOTHING HAS IMPROVED.','MEG HAS BEEN FOLDED INCORRECTLY.','THE DRESS OBJECTS.'][Math.floor(Math.random()*4)]);return}let d=e.clientX<W/2?-1:1;meg.v+=d*.006;wind+=d*2});
addEventListener('resize',resize);resize();tick();
</script></body></html>
