<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RAG MEG CIRCLE DRESS</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3efe5;color:#171717;font-family:"Courier New",monospace}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}#ui{position:fixed;inset:0;pointer-events:none}#title{position:absolute;top:9%;width:100%;text-align:center;font-size:clamp(28px,6vw,58px);line-height:.9;letter-spacing:.05em}#title small{display:block;font-size:.45em;margin-top:12px;letter-spacing:.17em}#menu{position:absolute;top:35%;width:100%;text-align:center;pointer-events:auto}.item{display:block;margin:13px auto;border:0;background:none;font:16px Courier New;padding:10px 22px;cursor:pointer}.item:hover{text-decoration:line-through}.hidden{display:none!important}#msg{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:min(90%,720px);text-align:center;font-size:13px;white-space:pre-line;opacity:0;transition:.2s}#note{position:absolute;bottom:15px;width:100%;text-align:center;font-size:10px;opacity:.58}#task{position:absolute;top:15px;left:15px;font-size:10px;max-width:260px;white-space:pre-line}#settings,#puzzle{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:min(88%,440px);background:#f3efe5;border:1px solid #171717;padding:22px;text-align:center;pointer-events:auto;font-size:13px}button,input{font:13px Courier New;background:#f3efe5;color:#171717;border:1px solid #171717;padding:8px;margin:5px}#puzzle input{width:60px;text-align:center;font-size:18px}.hint{font-size:10px;opacity:.6;margin-top:10px}</style></head><body>
<canvas id="c"></canvas><div id="ui"><div id="title">RAG MEG<small>CIRCLE DRESS</small></div><div id="menu"><button class="item" data-a="begin">BEGIN</button><button class="item" data-a="settings">SETTINGS</button><button class="item" data-a="leave">LEAVE</button></div><div id="settings" class="hidden">SOUND — unfortunately<br><br>MUSIC — apparently<br><br>RAG QUALITY — <button id="ragq">rag</button><br><br>CIRCLE DRESS — yes<br><br><button id="back">back</button></div><div id="puzzle" class="hidden"><b>MUNICIPAL LETTER-NUMBER MATTER</b><p>A = 1 &nbsp; B = 2 &nbsp; C = 3</p><p>G + R + E + G = ?</p><input id="answer" inputmode="numeric" maxlength="2"><button id="submit">FILE</button><div class="hint">Long Greg has misplaced a number. This has become your problem.</div></div><div id="msg"></div><div id="task"></div><div id="note">poke the heap if you absolutely must</div></div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),msg=document.querySelector('#msg'),task=document.querySelector('#task'),menu=document.querySelector('#menu'),title=document.querySelector('#title'),note=document.querySelector('#note'),settings=document.querySelector('#settings'),puzzle=document.querySelector('#puzzle');
let W,H,dpr,t=0,state='menu',pokes=0,wind=0,meg={x:.48,v:0,step:0},greg=0,orb=0,house=0,puzzled=false,done=false,keys={};
const line=(a,b,c,d)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()},say=(s,ms=2100)=>{msg.textContent=s;msg.style.opacity=1;clearTimeout(say.q);say.q=setTimeout(()=>msg.style.opacity=0,ms)};
function resize(){dpr=Math.min(devicePixelRatio||1,3);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
function base(){x.fillStyle='#f3efe5';x.fillRect(0,0,W,H);x.strokeStyle='#171717';x.fillStyle='#171717';x.lineWidth=1.2;x.lineCap='round';x.lineJoin='round'}
function heap(){let a=W*.5,b=H*.78;x.beginPath();x.moveTo(a-55,b);x.bezierCurveTo(a-48,b-19,a-24,b-29,a-5,b-17);x.bezierCurveTo(a+13,b-35,a+48,b-17,a+57,b);x.stroke();for(let i=-45;i<45;i+=5){x.globalAlpha=.12;line(a+i,b-18,a+i+18,b-3);x.globalAlpha=1}if(pokes>3){x.beginPath();x.arc(a+8,b-13,1.3,0,7);x.fill()}line(a+51,b-4,a+75+wind,b-20);wind*=.93}
function world(){let g=H*.79,hx=W*.08,hw=Math.min(130,W*.25),gx=W*.83;x.lineWidth=1.2;line(0,g,W,g);x.beginPath();x.arc(hx+hw/2,g-65,hw/2,Math.PI,0);x.lineTo(hx+hw,g);x.lineTo(hx,g);x.closePath();x.stroke();x.strokeRect(hx+hw*.42,g-53,hw*.2,53);x.font='9px Courier New';x.fillText('HOME, APPARENTLY',hx,g+16);x.strokeRect(gx-8,g-142,16,142);x.beginPath();x.arc(gx,g-151,8,0,7);x.stroke();line(gx-5,g-105,gx-25,g-75);line(gx+5,g-105,gx+25,g-75);x.fillText('LONG GREG',gx-28,g+16);x.beginPath();x.arc(W*.69,H*.19,20,0,7);x.stroke();x.fillText('LOCAL ORB',W*.69-28,H*.19+36);x.strokeRect(W*.51-22,g-31,44,31);x.fillText('BOX 4',W*.51-17,g+16);x.beginPath();x.arc(W*.34,g-7,7,0,7);x.stroke();x.fillText('PEBBLE',W*.34-17,g+16)}
function megDraw(){let cx=meg.x*W,g=H*.79,cy=g-87,b=Math.sin(t*.05+meg.step)*Math.min(3,Math.abs(meg.v)*650);cy+=b;
x.save();x.shadowColor='rgba(0,0,0,.10)';x.shadowBlur=8;x.shadowOffsetY=3;
let p=[[-28,-55],[-15,-63],[-2,-60],[12,-65],[28,-51],[24,-18],[31,10],[23,39],[9,51],[-6,47],[-20,53],[-31,32],[-27,4],[-31,-25]];
x.beginPath();p.forEach((q,i)=>{let f=wind*.25*Math.sin(t*.035+i*1.8)+meg.v*1000*(i<5?-1:1);let px=cx+q[0]+f,py=cy+q[1]+Math.sin(t*.025+i)*1.2;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.fillStyle='#ddd6c8';x.fill();x.stroke();x.restore();
x.save();x.globalAlpha=.18;x.lineWidth=.55;for(let i=-23;i<24;i+=3){line(cx+i,cy-48,cx+i+9,cy+38)}for(let j=-40;j<40;j+=5){line(cx-22,cy+j,cx+22,cy+j+6)}x.restore();
x.beginPath();for(let i=0;i<44;i++){let a=i/44*Math.PI*2,r=39+2*Math.sin(i*2.7)+wind*.45*Math.sin(a*3+t*.03),px=cx+Math.cos(a)*r,py=cy+50+Math.sin(a)*r*.42;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fillStyle='rgba(235,230,218,.92)';x.fill();x.stroke();
x.beginPath();x.arc(cx-8,cy-23,1.5,0,7);x.arc(cx+8,cy-23,1.5,0,7);x.fillStyle='#171717';x.fill();line(cx-6,cy-9,cx+6,cy-9);line(cx-13,cy+75,cx-16,g);line(cx+13,cy+75,cx+16,g);x.beginPath();x.moveTo(cx+25,cy-42);x.bezierCurveTo(cx+44+wind,cy-50,cx+33+wind*2,cy-63,cx+51+wind*3,cy-60);x.stroke();wind*=.95}
function objective(){task.textContent=done?'OBJECTIVE: nothing further has been requested.':greg===0?'OBJECTIVE: walk around until somebody inconveniences you.':!puzzled?'OBJECTIVE: Long Greg has created paperwork.\nTry clicking things.':!done?'OBJECTIVE: resolve the MUNICIPAL LETTER-NUMBER MATTER.':''}
function interact(px,py){let g=H*.79;const near=(a,b,r)=>Math.hypot(px-a,py-b)<r;
if(near(W*.83,g-100,75)){greg++;if(greg===1)say('LONG GREG: Meg. The festival has lost the number 37.\nMEG: okay.',3000);else if(greg===2){puzzled=true;puzzle.classList.remove('hidden');say('LONG GREG: I filled out most of it wrong.');}else say('LONG GREG: I am extremely tall today.\nMEG: congratulations.');return}
if(near(W*.69,H*.19,55)){orb++;say(orb===1?'LOCAL ORB: PLEASE DO NOT INTERPRET ME.':orb===2?'THE ORB IS LOCALLY SOURCED.':'THE ORB DECLINES FURTHER COMMENT.');return}
if(near(W*.51,g-20,55)){say('BOX 4 contains BOX 3.\nBOX 3 is currently elsewhere.');return}
if(near(W*.34,g-10,45)){say('YOU FOUND: PEBBLE.\nVALUE: emotionally negligible.');return}
if(near(W*.12,g-60,90)){house++;say(house===1?'THE DOOR IS UNLOCKED.\nMeg does not go in.':'HOME REMAINS WHERE YOU LEFT IT.');return}
let mx=meg.x*W;if(near(mx,g-85,75)){wind=(Math.random()-.5)*25;say(['MEG ENDURES.','THE DRESS OBJECTS.','MEG HAS BEEN FOLDED INCORRECTLY.','A THREAD HAS BECOME INVOLVED.'][Math.floor(Math.random()*4)]);return}
say('NOT INTERACTIVE.\nThis is probably for the best.',1200)}
function tick(){t++;base();if(state==='menu'||state==='leaving')heap();else if(state==='game'){let accel=0;if(keys.ArrowLeft||keys.a)accel-=.0012;if(keys.ArrowRight||keys.d)accel+=.0012;meg.v+=accel;meg.v*=.90;meg.x=Math.max(.04,Math.min(.96,meg.x+meg.v));if(Math.abs(meg.v)>.0003)meg.step+=Math.abs(meg.v)*15;world();megDraw();objective()}requestAnimationFrame(tick)}
function begin(){state='game';menu.classList.add('hidden');title.classList.add('hidden');note.textContent='← → / A D move · click things to bother them';say('OBJECTIVE COMPLETE: WAKE UP.');setTimeout(()=>say('OBJECTIVE FAILED: GET DRESSED.'),1900)}
menu.onclick=e=>{let a=e.target.dataset.a;if(a==='begin')begin();if(a==='settings'){settings.classList.remove('hidden');menu.classList.add('hidden')}if(a==='leave'){state='leaving';menu.classList.add('hidden');say('GOOD CHOICE.');setTimeout(()=>{say('THE OPERATING SYSTEM HAS DENIED YOUR REQUEST.');menu.classList.remove('hidden')},1800)}};
document.querySelector('#back').onclick=()=>{settings.classList.add('hidden');menu.classList.remove('hidden')};let qs=['rag','better rag','irresponsible'];document.querySelector('#ragq').onclick=e=>e.target.textContent=qs[(qs.indexOf(e.target.textContent)+1)%3];
document.querySelector('#submit').onclick=()=>{let v=document.querySelector('#answer').value.trim();if(v==='37'){puzzle.classList.add('hidden');done=true;say('CORRECT.\n37 HAS BEEN LOCATED EXACTLY WHERE LONG GREG LEFT IT.\nREWARD: ONE LETTER.',3000);setTimeout(()=>say('YOU RECEIVED: Q\nIt does not unlock anything.',2600),3200)}else say('FORM REJECTED: number insufficiently Greg.',1600)};
c.addEventListener('pointerdown',e=>{if(state==='menu'){pokes++;wind=(Math.random()-.5)*20;if(pokes===4)say('MEG: can I help you');else if(pokes>5)say('MEG HAS RECEIVED YOUR FEEDBACK.');return}if(state!=='game')return;if(e.pointerType!=='mouse'){let d=e.clientX<W/2?-1:1;meg.v+=d*.006}interact(e.clientX,e.clientY)});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();keys[e.key]=true;keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});addEventListener('resize',resize);resize();tick();
</script></body></html>
