const BPM=118,STEP=60/BPM/4,LOOP_STEPS=256;
function audioReady(){
 if(!soundOn)return;
 try{
  if(!audioContext){
   audioContext=new(window.AudioContext||window.webkitAudioContext)();
   masterBus=audioContext.createGain();masterBus.gain.value=.72;
   const limiter=audioContext.createDynamicsCompressor();limiter.threshold.value=-12;limiter.knee.value=15;limiter.ratio.value=5;limiter.attack.value=.006;limiter.release.value=.16;
   masterBus.connect(limiter);limiter.connect(audioContext.destination);
   musicBus=audioContext.createGain();musicBus.gain.value=musicVolume;musicBus.connect(masterBus);
   effectsBus=audioContext.createGain();effectsBus.gain.value=effectsVolume;effectsBus.connect(masterBus);
   duckBus=audioContext.createGain();duckBus.connect(musicBus);
   echo=audioContext.createDelay(1);echo.delayTime.value=STEP*3;
   const feedback=audioContext.createGain(),wet=audioContext.createGain(),filter=audioContext.createBiquadFilter();feedback.gain.value=.24;wet.gain.value=.19;filter.type='lowpass';filter.frequency.value=2400;echo.connect(filter);filter.connect(feedback);feedback.connect(echo);filter.connect(wet);wet.connect(musicBus);
   noiseBuffer=audioContext.createBuffer(1,audioContext.sampleRate,audioContext.sampleRate);
   const n=noiseBuffer.getChannelData(0);let seed=913;for(let i=0;i<n.length;i++){seed=(Math.imul(seed,1664525)+1013904223)>>>0;n[i]=seed/2147483648-1}
   nextBeat=audioContext.currentTime+.08;
  }

  if(musicTimer===null){musicTimer=setInterval(scheduleMusic,30);scheduleMusic()}
 }catch{}
}
function voice(freq,at,length,volume,type='sine',bus=effectsBus,cutoff=0,endFreq=0,attack=.008){
 if(!audioContext||!bus)return;
 const o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,at+Math.min(length,.16));
 g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),at+attack);g.gain.exponentialRampToValueAtTime(.0001,at+length);
 let filter;if(cutoff){filter=audioContext.createBiquadFilter();filter.type='lowpass';filter.frequency.setValueAtTime(cutoff,at);filter.frequency.exponentialRampToValueAtTime(Math.max(100,cutoff*.35),at+length);o.connect(filter);filter.connect(g)}else o.connect(g);

}
function hiss(at,length,volume,frequency=6000,bus=effectsBus){if(!noiseBuffer||!bus)return;const source=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),g=audioContext.createGain();source.buffer=noiseBuffer;filter.type='highpass';filter.frequency.value=frequency;g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(volume,at+.004);g.gain.exponentialRampToValueAtTime(.0001,at+length);source.connect(filter);filter.connect(g);g.connect(bus);source.start(at);source.stop(at+length+.01);source.onended=()=>{source.disconnect();filter.disconnect();g.disconnect()}}
const hz=m=>440*Math.pow(2,(m-69)/12);
function musicBeat(step,at){
 const bar=Math.floor(step/16),beat=step%16,root=[36,32,39,34][Math.floor(bar/4)];
 // Four-on-the-floor kick, soft clap, offbeat open hats and sixteenth detail.
 if(beat%4===0){voice(145,at,.26,.68,'sine',musicBus,0,44);hiss(at,.018,.035,5500,musicBus);duckBus.gain.cancelScheduledValues(at);duckBus.gain.setValueAtTime(.3,at);duckBus.gain.linearRampToValueAtTime(1,at+STEP*2.7)}
 if(beat===4||beat===12){hiss(at,.13,.19,1100,musicBus);hiss(at+.018,.09,.12,1800,musicBus);voice(180,at,.095,.08,'triangle',musicBus)}
 if(beat%4===2)hiss(at,.16,.11,7000,musicBus);else if(beat%2===0||(bar%4===3&&beat>11))hiss(at,.042,.045,8500,musicBus);
 if([2,6,10,14].includes(beat)){voice(hz(root),at,STEP*1.5,.21,'sawtooth',duckBus,650);voice(hz(root),at,STEP*1.45,.24,'sine',duckBus)}
 if(beat===0){const third=(root===36?3:4);for(const offset of [0,third,7,14])voice(hz(root+24+offset),at,STEP*15,.024,'triangle',duckBus,1800,0,.12)}
 const arp=[0,7,12,7,3,10,14,7];if(beat%2===0){let offset=arp[beat/2];if(root!==36&&offset===3)offset=4;const note=hz(root+24+offset);const v=voice(note,at,STEP*2.1,.085,'triangle',duckBus,2600);v?.connect(echo)}

}
function scheduleMusic(){if(!audioContext||audioContext.state!=='running'||document.hidden)return;const now=audioContext.currentTime;if(nextBeat<now-.2)nextBeat=now+.04;while(nextBeat<now+.16){if(soundOn&&musicEnabled&&musicVolume>0)musicBeat(musicStep,nextBeat);musicStep=(musicStep+1)%LOOP_STEPS;nextBeat+=STEP}}
function tone(freq=220,length=.25,volume=.12){if(!soundOn||!audioContext)return;voice(freq,audioContext.currentTime+.005,length,volume,'sine')}
function fx(kind){if(!soundOn||!audioContext)return;const at=audioContext.currentTime+.005;
 if(kind==='click'){voice(620,at,.05,.12,'triangle',effectsBus,0,310);return}
 if(kind==='grab'){hiss(at,.12,.15,1800);voice(180,at,.09,.1,'sine',effectsBus,0,90);return}
 if(kind==='drop'){voice(story.wet?90:140,at,.18,.22,'sine',effectsBus,0,45);hiss(at,.12,story.wet?.2:.09,story.wet?650:2200);return}
 if(kind==='rustle'){hiss(at,.085,story.wet?.1:.055,story.wet?750:3000);return}
 if(kind==='puddle'){for(let i=0;i<6;i++)voice(180+i*49,at+i*.075,.19,.13,'sine',effectsBus,0,70+i*15);hiss(at,.48,.17,600);return}
 if(kind==='greg'){voice(102,at,.1,.18,'triangle',effectsBus,550);voice(82,at+.14,.14,.13,'triangle',effectsBus,500);return}
 if(kind==='box'||kind==='bench'){hiss(at,.17,.15,1300);voice(240,at,.12,.17,'triangle',effectsBus,0,100);return}
 if(kind==='pebble'){voice(750,at,.055,.16,'triangle');hiss(at,.06,.1,2300);return}
 if(kind==='line'){hiss(at,.45,.09,3300);return}
 if(kind==='orb'||kind==='home'){[0,7,12].forEach((n,i)=>voice(hz(60+n),at+i*.13,.7,.08,'sine'));return}

}
function movementAudio(){if(!soundOn||!audioContext||mode!=='game')return;const now=audioContext.currentTime;const moving=direction()!==0||(grab&&grab.moved);if(moving&&now-lastRustle>.17){fx('rustle');lastRustle=now}const falling=cloth.some(p=>p.y>floor-9&&p.y-p.oy>2);if(falling&&now-lastLanding>.35){fx('drop');lastLanding=now}}

function makeStars(){let seed=91;const rand=()=>((seed=Math.imul(seed,1664525)+1013904223|0)>>>0)/4294967296;stars=Array.from({length:330},()=>({x:rand()*WORLD,y:rand()*.62,r:rand()<.09?1.15:.55,phase:rand()*7}))}
function resetCloth(cx=300){cloth.length=0;seams.length=0;for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){const px=cx-48+i*8,py=floor-40+j*5;cloth.push({x:px,y:py,ox:px,oy:py,row:j});if(i)seams.push([j*COLS+i-1,j*COLS+i,8]);if(j)seams.push([(j-1)*COLS+i,j*COLS+i,5]);if(i&&j)seams.push([(j-1)*COLS+i-1,j*COLS+i,Math.hypot(8,5)]);if(i<COLS-1&&j)seams.push([(j-1)*COLS+i+1,j*COLS+i,Math.hypot(8,5)])}}
function resize(){const oldFloor=floor;W=innerWidth;H=innerHeight;floor=H*.72;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);for(const p of cloth){p.y+=floor-oldFloor;p.oy+=floor-oldFloor}camera=clamp(camera,0,Math.max(0,WORLD-W));if(!started){camera=clamp(center()-W*.5,0,WORLD-W)}grab=null;pendingTap=null;clearMovement()}

function clothStep(){const dir=mode==='game'?direction():0;const damp=story.wet?.95:.965;for(const p of cloth){const vx=(p.x-p.ox)*damp,vy=(p.y-p.oy)*.98;p.ox=p.x;p.oy=p.y;p.x+=vx;p.y+=vy+(story.wet?.34:.28)}

 for(let k=0;k<8;k++){for(const [ai,bi,rest] of seams){const a=cloth[ai],b=cloth[bi],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,f=(len-rest)/len*.42;a.x+=dx*f;a.y+=dy*f;b.x-=dx*f;b.y-=dy*f}

}
// A shared floor plane keeps the mesh's lower edge quietly rumpled.
function centerSafe(){return cloth[3*COLS+6].x}
function nearby(){const cx=center();let best=null,dist=Infinity;for(const o of objects){const d=Math.abs(cx-o.x);if(d<o.reach&&d<dist){if((o.id==='puddle'&&story.absorbed)||(o.id==='dress'&&story.dressFound))continue;dist=d;best=o}}return best}

function finishPointer(e,cancelled=false){if(grab?.pointer===e.pointerId){const wasTap=!grab.moved;if(grab.moved&&!cancelled)fx('drop');grab=null;if(wasTap&&!cancelled&&mode==='game'){if(nearby())interact();else say(story.wet?'Meg is now more damp.':'The cotton remains involved.',2000)}}if(pendingTap?.pointer===e.pointerId){const tap=pendingTap;pendingTap=null;if(!cancelled&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<12){if(tap.object)interact(tap.object.id);else say('Drag Meg, or hold an arrow to travel.',1800)}}}
canvas.addEventListener('pointerup',e=>finishPointer(e));canvas.addEventListener('pointercancel',e=>finishPointer(e,true));canvas.addEventListener('lostpointercapture',e=>{if(grab?.pointer===e.pointerId)grab=null;if(pendingTap?.pointer===e.pointerId)pendingTap=null});
for(const [id,dir] of [['left',-1],['right',1]]){const b=$('#'+id);b.addEventListener('pointerdown',e=>{e.preventDefault();if(mode!=='game')return;audioReady();movePointers.set(e.pointerId,dir);b.classList.add('pressed');b.setPointerCapture(e.pointerId)});const off=e=>{movePointers.delete(e.pointerId);b.classList.toggle('pressed',[...movePointers.values()].includes(dir))};b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)}
$('#poke').onclick=()=>interact();
addEventListener('keydown',e=>{if(e.key==='Escape'){if(mode==='game')showMenu();else if(mode==='settings')$('#back').click();return}if(mode!=='game'||e.target.closest('button,input'))return;const k=e.key.toLowerCase();if(['arrowleft','arrowright','a','d',' '].includes(k)){e.preventDefault();audioReady();keys.add(k);if(k===' '&&!e.repeat)interact()}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{clearMovement();grab=null;pendingTap=null});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearMovement();grab=null;pendingTap=null}});addEventListener('resize',resize);
makeStars();resetCloth();resize();requestAnimationFrame(frame);
