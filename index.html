function objective(){task.textContent=done?'OBJECTIVE: nothing further has been requested.':greg===0?'OBJECTIVE: walk near the white things. POKE them.':!puzzled?'OBJECTIVE: Long Greg has created paperwork.\nPOKE him again.':!done?'OBJECTIVE: resolve the MUNICIPAL LETTER-NUMBER MATTER.':''}function targets(){let g=H*.76;return[{x:W*.82,y:g-76,r:82,id:'greg'},{x:W*.69,y:H*.2,r:62,id:'orb'},{x:W*.51,y:g-22,r:58,id:'box'},{x:W*.34,y:g-8,r:52,id:'pebble'},{x:W*.12,y:g-58,r:92,id:'house'},{x:W*.94,y:g-60,r:58,id:'choir'}]}
